const NS = "http://www.w3.org/2000/svg";
const fmt = (n) => n.toLocaleString("ja-JP");

function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function setText(sec, key, value) {
  sec.querySelectorAll(`[data-f="${key}"]`).forEach((n) => { n.textContent = value; });
}
function totalLine(sec, label, n) {
  const p = sec.querySelector('[data-f="total"]');
  p.textContent = label + " ";
  const b = document.createElement("b");
  b.textContent = fmt(n) + "人";
  p.appendChild(b);
}
function footer(f, lines) {
  for (const s of lines) {
    const p = document.createElement("p");
    p.textContent = s;
    f.appendChild(p);
  }
}
/* L1専用: 脚注を箇条書き（ul）で描く */
function footerList(f, lines) {
  const ul = document.createElement("ul");
  for (const s of lines) {
    const li = document.createElement("li");
    li.textContent = s;
    ul.appendChild(li);
  }
  f.appendChild(ul);
}
const portHash = (slug, port) => `#/${slug}/${encodeURIComponent(port)}`;

/* ドットマトリクス地図: 行ごとの連続区間 [j, i0, n] を長さ0の線分＋丸い線端で描く */
function drawDots(svg, dots) {
  const P = dots.pitch, parts = [];
  for (const [j, i0, n] of dots.runs) {
    const y = P / 2 + j * P;
    for (let i = i0; i < i0 + n; i++) parts.push(`M${P / 2 + i * P} ${y}h0`);
  }
  el("path", { d: parts.join(""), class: "land", "stroke-width": dots.r * 2 }, svg);
}
function pts(route) { return route.map((p) => p.join(",")).join(" "); }

/* 引き出し線の先のラベル（A案: 名前→人数の縦組み）。it.lines: [[text, class, size, dy]] */
function label(svg, it) {
  // a2確定形: 左右どちらの列でもブロック内は左揃え（名前は数字の左上に来る）。
  // 左列はブロック右端が引き出し線側に固定されるため、左端は box[0] を使う。
  const g = el("g", { "aria-hidden": "true" }, svg);
  for (const [t, cls, size, dy] of it.lines) {
    el("text", { x: it.box[0], y: it.ty + dy, "text-anchor": "start", class: cls, "font-size": size }, g, t);
  }
  return g;
}

/* タップ領域（透明）。円（小さい円は指で押せる大きさに広げる）＋ラベルの矩形 */
function hitArea(svg, it, aria, onActivate, bubble) {
  const g = el("g", { class: "hitg", tabindex: 0, role: "link", "aria-label": aria }, svg);
  el("circle", { cx: it.cx, cy: it.cy, r: Math.max(it.r, 28), class: "hit" }, g);
  const b = it.box, pad = 8;
  el("rect", { x: b[0] - pad, y: b[1] - pad, width: b[2] - b[0] + 2 * pad, height: b[3] - b[1] + 2 * pad, class: "hit" }, g);
  const press = (on) => bubble && bubble.classList.toggle("press", on);
  g.addEventListener("pointerdown", () => press(true));
  ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => g.addEventListener(ev, () => press(false)));
  g.addEventListener("click", (e) => onActivate(e, it));
  g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onActivate(e, it); } });
  return g;
}

/* 円・線・ラベル・芯を描き、リンク付きの項目にタップ領域を付ける */
function drawItems(svg, items, coreR, ariaOf, hrefOf) {
  const bubbles = {};
  for (const it of items) if (it.r > 0) bubbles[it.name] = el("circle", { cx: it.cx, cy: it.cy, r: it.r, class: "bubble" }, svg);
  for (const it of items) el("polyline", { points: pts(it.route), class: "leader" }, svg);
  for (const it of items) label(svg, it);
  for (const it of items) el("circle", { cx: it.cx, cy: it.cy, r: coreR, class: "core" }, svg);
  // タップ領域は小さい円を後に重ねる（大きい円の領域に埋もれないように）
  for (const it of items.slice().sort((a, b) => b.r - a.r)) {
    hitArea(svg, it, ariaOf(it), (e) => navigate(hrefOf(it), e), bubbles[it.name]);
  }
}

/* リンクのない項目（区分計のみの区分）: 円・線・ラベル・芯だけを描き、タップ領域は付けない */
function drawPlain(svg, items, coreR) {
  for (const it of items) if (it.r > 0) el("circle", { cx: it.cx, cy: it.cy, r: it.r, class: "bubble" }, svg);
  for (const it of items) el("polyline", { points: pts(it.route), class: "leader" }, svg);
  for (const it of items) label(svg, it);
  for (const it of items) el("circle", { cx: it.cx, cy: it.cy, r: coreR, class: "core" }, svg);
}

/* ---------- L1 全国 ---------- */
function buildL1() {
  const D = DATA.l1, sec = document.getElementById("s-l1");
  document.getElementById("h-l1").textContent = D.title;
  setText(sec, "subtitle", D.subtitle);
  totalLine(sec, D.total_label, D.total);
  const svg = document.getElementById("map-l1");
  svg.setAttribute("viewBox", D.view.join(" "));
  svg.setAttribute("aria-label", D.title);
  drawDots(svg, D.dots);
  el("polyline", { points: pts(D.inset), class: "frame" }, svg);
  drawPlain(svg, D.regions.filter((r) => !r.link), D.core_r);
  drawItems(svg, D.regions.filter((r) => r.link), D.core_r,
    (r) => `${r.name} ${fmt(r.workers)}人。管内の港を見る`, (r) => `#/${r.link}`);
  footerList(document.getElementById("foot-l1"), D.foot);
  return sec;
}

function newSection(tplId, id) {
  const sec = document.getElementById(tplId).content.firstElementChild.cloneNode(true);
  sec.id = id;
  const h1 = sec.querySelector("h1");
  h1.id = "h-" + id;
  sec.setAttribute("aria-labelledby", h1.id);
  document.getElementById("app").appendChild(sec);
  return sec;
}

/* ---------- L2 区分 ---------- */
function buildL2(slug) {
  const D = DATA.l2[slug], sec = newSection("tpl-l2", "s-l2-" + slug);
  sec.querySelector("h1").textContent = D.title;
  setText(sec, "subtitle", D.subtitle);
  setText(sec, "crumb", D.crumb);
  totalLine(sec, D.total_label, D.total);
  const svg = sec.querySelector("svg");
  svg.setAttribute("viewBox", D.view.join(" "));
  svg.setAttribute("aria-label", D.title);
  drawDots(svg, D.dots);
  for (const [a, b] of D.frame) el("polyline", { points: pts([a, b]), class: "frame" }, svg);
  drawItems(svg, D.ports, D.core_r,
    (p) => `${p.name} ${fmt(p.workers)}人。業種別の内訳を見る`, (p) => portHash(slug, p.link));
  footer(sec.querySelector(".foot"), D.foot);
  return sec;
}

/* ---------- L3 港 ---------- */
function arcPath(cx, cy, ro, ri, a0, a1) {
  const pt = (r, a) => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
  const large = a1 - a0 > Math.PI ? 1 : 0;
  const [x0, y0] = pt(ro, a0), [x1, y1] = pt(ro, a1), [x2, y2] = pt(ri, a1), [x3, y3] = pt(ri, a0);
  return `M${x0} ${y0}A${ro} ${ro} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${ri} ${ri} 0 ${large} 0 ${x3} ${y3}Z`;
}
function buildL3(port) {
  const D = DATA.l3[port], sec = newSection("tpl-l3", "s-l3-" + D.slug + "-" + Object.keys(DATA.l3).indexOf(port));
  sec.querySelector("h1").textContent = D.title;
  setText(sec, "subtitle", D.subtitle);
  setText(sec, "crumb-region", D.region);
  sec.querySelector('[data-f="crumb-region"]').setAttribute("href", `#/${D.slug}`);
  setText(sec, "crumb", D.port);
  totalLine(sec, D.total_label, D.total);

  // ドーナツ: 12時から時計回りに人数の大きい順。値の無い区分・0人の区分はスライスを作らない
  const svg = sec.querySelector(".donut");
  const vals = D.items.filter((i) => i.value != null && i.value > 0);
  const sum = vals.reduce((s, i) => s + i.value, 0);
  const C = 200, RO = 196, RI = 126;
  let a = 0;
  if (!vals.length) {
    el("circle", { cx: C, cy: C, r: (RO + RI) / 2, class: "empty", "stroke-width": RO - RI }, svg);
  }
  for (const it of vals) {
    const sweep = 2 * Math.PI * it.value / sum;
    if (sweep >= 2 * Math.PI - 1e-9) {   // 1区分だけのとき
      el("path", { d: arcPath(C, C, RO, RI, 0, Math.PI) + arcPath(C, C, RO, RI, Math.PI, 2 * Math.PI), class: "s-" + it.cls }, svg);
    } else {
      el("path", { d: arcPath(C, C, RO, RI, a, a + sweep), class: "s-" + it.cls }, svg);
    }
    a += sweep;
  }
  el("text", { x: C, y: C - 30, "text-anchor": "middle", class: "c-label" }, svg, D.total_label);
  el("text", { x: C, y: C + 32, "text-anchor": "middle", class: "c-total" }, svg, fmt(D.total) + "人");
  svg.setAttribute("aria-label", `${D.title}の内訳。` +
    D.items.map((i) => i.value != null ? `${i.label} ${fmt(i.disp)}人` : `${i.label} ${i.reason}`).join("、"));

  const tb = sec.querySelector(".cats tbody");
  for (const it of D.items) {
    const tr = document.createElement("tr");
    const th = document.createElement("td");
    const chip = document.createElement("span");
    chip.className = "chip " + (it.value != null && it.value > 0 ? "s-" + it.cls : "none");
    th.appendChild(chip);
    th.appendChild(document.createTextNode(it.label));
    tr.appendChild(th);
    if (it.value != null) {
      const n = document.createElement("td"); n.className = "num";
      const b = document.createElement("b"); b.textContent = fmt(it.disp) + "人"; n.appendChild(b);
      const pc = document.createElement("td"); pc.className = "num"; pc.textContent = it.pct != null ? it.pct : "－";
      tr.append(n, pc);
    } else {
      const n = document.createElement("td"); n.className = "nodata"; n.colSpan = 2; n.textContent = it.reason;
      tr.appendChild(n);
    }
    tb.appendChild(tr);
  }
  footer(sec.querySelector(".foot"), D.foot);
  return sec;
}

/* ---------- 遷移 ---------- */
const screens = {};
function screenFor(key) {
  const parts = key.split("/").filter(Boolean);
  let k = "", depth = 1, make = null;
  if (parts.length >= 1 && DATA.l2[parts[0]]) {
    k = parts[0]; depth = 2; make = () => buildL2(parts[0]);
    if (parts.length >= 2) {
      let port = null;
      try { port = decodeURIComponent(parts[1]); } catch (e) { port = null; }
      const d = port && DATA.l3[port];
      if (d && d.slug === parts[0]) { k = parts[0] + "/" + port; depth = 3; make = () => buildL3(port); }
    }
  }
  if (!screens[k]) screens[k] = { sec: make ? make() : document.getElementById("s-l1"), depth };
  return screens[k];
}
let current = null, origin = null;

function navigate(hash, ev) {
  const app = document.getElementById("app").getBoundingClientRect();
  if (ev && ev.clientX != null && ev.clientX !== 0) origin = `${ev.clientX - app.left}px ${ev.clientY - app.top}px`;
  location.hash = hash;
}
function show() {
  const nextS = screenFor(location.hash.replace(/^#\/?/, ""));
  const next = nextS.sec;
  if (current && current.sec === next) return;
  const prev = current;
  current = nextS;
  document.title = next.querySelector("h1").textContent;
  if (!prev) { next.classList.add("active"); return; }
  const deeper = nextS.depth > prev.depth;
  const p = prev.sec;
  p.classList.remove("active");
  p.classList.add("leaving");
  next.style.transformOrigin = deeper && origin ? origin : "50% 0";
  next.classList.add(deeper ? "enter-in" : "enter-out", "active");
  void next.offsetWidth;            // 初期状態を確定させてから遷移させる
  next.classList.remove("enter-in", "enter-out");
  origin = null;
  window.scrollTo(0, 0);
  setTimeout(() => p.classList.remove("leaving"), parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--dur")) || 0);
  next.querySelector("h1").setAttribute("tabindex", "-1");
  next.querySelector("h1").focus({ preventScroll: true });
}

screens[""] = { sec: buildL1(), depth: 1 };
window.addEventListener("hashchange", show);
show();
</script>
